<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indisponibilità campionato</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#667085;--bd:#dfe3e8;--ac:#0b6e4f;--acx:#fff;--er:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b1f26;--tx:#eef0f3;--mu:#98a2b3;--bd:#2c323c;--ac:#3ecf9b;--acx:#062117;--er:#f97066}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b1f26;--tx:#eef0f3;--mu:#98a2b3;--bd:#2c323c;--ac:#3ecf9b;--acx:#062117;--er:#f97066}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
p.s{color:var(--mu);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:600}
.p{background:var(--ac);color:var(--acx)}
.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.item small{color:var(--mu);display:block}
.x{background:none;color:var(--er);padding:6px 10px}
.err{color:var(--er);font-size:.88rem;margin-top:8px;min-height:1.2em}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;font:inherit;font-size:.92rem;margin:0}
.empty{color:var(--mu);font-size:.92rem}
</style>
</head>
<body>
<main>
<h1>Indisponibilità campionato</h1>
<p class="s">Segna quando NON ci sei, dal 1 ottobre 2026 al 15 gennaio 2027. Puoi aggiungere più periodi.</p>

<div class="card">
  <label for="nome">Nome e cognome</label>
  <input id="nome" autocomplete="name" placeholder="Es. Mario Rossi">
</div>

<div class="card">
  <div class="row">
    <div><label for="dal">Dal</label><input type="date" id="dal" min="2026-10-01" max="2027-01-15"></div>
    <div><label for="al">Al (incluso)</label><input type="date" id="al" min="2026-10-01" max="2027-01-15"></div>
  </div>
  <div style="margin-top:10px"><label for="mot">Motivo (facoltativo)</label><input id="mot" placeholder="Es. esame, lavoro, infortunio"></div>
  <div class="err" id="err"></div>
  <div class="acts"><button class="p" id="add">+ Aggiungi periodo</button></div>
  <p class="empty" style="margin:8px 0 0">Per un giorno solo, lascia “Al” vuoto.</p>
</div>

<div class="card">
  <strong>Periodi indicati</strong>
  <div id="list"><p class="empty">Nessun periodo aggiunto. Se sei sempre disponibile, invia comunque il messaggio.</p></div>
</div>

<div class="card">
  <strong>Anteprima messaggio</strong>
  <pre id="prev" style="margin-top:8px"></pre>
  <div class="acts">
    <button class="p" id="wa">Invia su WhatsApp</button>
    <button class="g" id="em">Invia via email</button>
    <button class="g" id="cp">Copia testo</button>
  </div>
  <div class="err" id="msg" style="color:var(--mu)"></div>
</div>
</main>

<script>
(function(){
  var items=[];
  var $=function(i){return document.getElementById(i)};
  function fmt(d){var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
  function text(){
    var n=$("nome").value.trim()||"(nome)";
    var t="Indisponibilità campionato – "+n+"\n";
    if(!items.length){t+="Nessuna indisponibilità: sono disponibile per tutto il periodo.";return t}
    items.forEach(function(x){
      var r=x.a&&x.a!==x.d?"dal "+fmt(x.d)+" al "+fmt(x.a):"il "+fmt(x.d);
      t+="• "+r+(x.m?" ("+x.m+")":"")+"\n";
    });
    return t.trim();
  }
  function render(){
    var l=$("list");l.innerHTML="";
    if(!items.length){l.innerHTML='<p class="empty">Nessun periodo aggiunto. Se sei sempre disponibile, invia comunque il messaggio.</p>'}
    items.forEach(function(x,i){
      var d=document.createElement("div");d.className="item";
      var s=document.createElement("div");
      var a=document.createElement("span");
      a.textContent=x.a&&x.a!==x.d?fmt(x.d)+" → "+fmt(x.a):fmt(x.d);
      s.appendChild(a);
      if(x.m){var sm=document.createElement("small");sm.textContent=x.m;s.appendChild(sm)}
      var b=document.createElement("button");b.className="x";b.textContent="Rimuovi";
      b.onclick=function(){items.splice(i,1);render()};
      d.appendChild(s);d.appendChild(b);l.appendChild(d);
    });
    $("prev").textContent=text();
  }
  $("add").onclick=function(){
    var d=$("dal").value,a=$("al").value;$("err").textContent="";
    if(!d){$("err").textContent="Inserisci almeno la data di inizio.";return}
    if(a&&a<d){$("err").textContent="La data finale è prima dell'inizio.";return}
    items.push({d:d,a:a,m:$("mot").value.trim()});
    items.sort(function(x,y){return x.d<y.d?-1:1});
    $("dal").value="";$("al").value="";$("mot").value="";render();
  };
  $("nome").addEventListener("input",function(){$("prev").textContent=text()});
  function chk(){if(!$("nome").value.trim()){$("msg").textContent="Inserisci prima il tuo nome.";$("nome").focus();return false}$("msg").textContent="";return true}
  $("wa").onclick=function(){if(chk())window.open("https://wa.me/?text="+encodeURIComponent(text()),"_blank")};
  $("em").onclick=function(){if(chk())location.href="mailto:?subject="+encodeURIComponent("Indisponibilità campionato – "+$("nome").value.trim())+"&body="+encodeURIComponent(text())};
  $("cp").onclick=function(){
    if(!chk())return;
    try{navigator.clipboard.writeText(text()).then(function(){$("msg").textContent="Testo copiato."},function(){$("msg").textContent="Copia non riuscita: seleziona il testo a mano."})}
    catch(e){$("msg").textContent="Copia non riuscita: seleziona il testo a mano."}
  };
  render();
})();
</script>
</body>
</html>
